<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="아이폰과 아이패드의 부품 제조사와 배터리 정보를 확인하세요.">
  <meta name="color-scheme" content="light dark">
  <title>기기 확인</title>
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20261103-3">
  <script type="module" src="./app.js?v=20261103-3"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="주 메뉴">
      <a href="#home" data-nav="home"><span data-icon="home"></span><span>홈</span></a>
      <a href="#report" data-nav="report"><span data-icon="report"></span><span>분석 결과</span></a>
      <a href="#history" data-nav="history"><span data-icon="history"></span><span>보관함</span></a>
    </nav>
  </div>
  <input id="file-input" type="file" multiple accept=".tar.gz,.tgz,.tar,.zip,.gz,.ips,.json,.jsonl,.ndjson,.plist,.xml,.txt,.log,.csv" hidden>
  <input id="folder-input" type="file" webkitdirectory multiple hidden>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-top"><button class="icon-button" id="close-dialog" aria-label="닫기"><svg viewBox="0 0 256 256" aria-hidden="true"><use href="./assets/icons.svg#close"/></svg></button></div>
    <div id="dialog-content"></div>
  </dialog>
  <noscript><p>파일을 분석하려면 자바스크립트를 켜주세요.</p></noscript>
</body>
</html>
